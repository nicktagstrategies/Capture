name: Capture
options:
  bundleIdPrefix: com.capture
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: "" # set to your Apple Developer team ID (from Apex app setup)
    ENABLE_USER_SCRIPT_SANDBOXING: NO

packages:
  StripePaymentSheet:
    url: https://github.com/stripe/stripe-ios
    from: "23.30.0"
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: "7.1.0"
  Kingfisher:
    url: https://github.com/onevcat/Kingfisher
    from: "7.12.0"

targets:
  Capture:
    type: application
    platform: iOS
    sources:
      - path: Capture
    resources:
      - path: Capture/Resources/Assets.xcassets
        optional: true
    dependencies:
      - package: StripePaymentSheet
        product: StripePaymentSheet
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: Kingfisher
    info:
      path: Capture/Resources/Info.plist
      properties:
        CFBundleDisplayName: Capture
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: ""
          UIImageName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSLocationWhenInUseUsageDescription: Capture uses your location to find nearby photographers.
        NSCameraUsageDescription: Capture uses the camera for profile photos.
        NSPhotoLibraryUsageDescription: Capture accesses photos to upload portfolio images.
        ITSAppUsesNonExemptEncryption: false
        GIDClientID: $(GOOGLE_IOS_CLIENT_ID)
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - $(REVERSED_GOOGLE_IOS_CLIENT_ID)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.capture.app
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_FILE: Capture/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Capture/Resources/Capture.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_STRICT_CONCURRENCY: complete

  CaptureTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CaptureTests
    dependencies:
      - target: Capture
