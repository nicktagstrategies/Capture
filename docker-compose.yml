services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: capture-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: capture
      POSTGRES_PASSWORD: capture
      POSTGRES_DB: capture
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U capture"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: capture-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
