openapi: 3.1.0
info:
  title: Capture API
  version: 0.1.0
  description: |
    HTTP contract between the Capture iOS app and the Capture server.
    The iOS networking layer mirrors these shapes by hand today; once the
    contract stabilizes we'll codegen `APITypes.swift` from this file.
servers:
  - url: http://localhost:3000
    description: Local dev
  - url: https://api.capture.app
    description: Production (placeholder)

paths:
  /health:
    get:
      summary: Liveness probe
      responses:
        '200':
          description: OK
  /config:
    get:
      summary: Runtime config for the iOS client
      responses:
        '200':
          description: Config values
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Config'
  /auth/email/signup:
    post:
      summary: Sign up with email + password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, name]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
                name: { type: string }
      responses:
        '201': { description: Session, content: { application/json: { schema: { $ref: '#/components/schemas/SessionResponse' } } } }
  /auth/email/login:
    post:
      summary: Log in with email + password
      responses:
        '200': { description: Session, content: { application/json: { schema: { $ref: '#/components/schemas/SessionResponse' } } } }
  /auth/apple:
    post:
      summary: Exchange an Apple identity token for a Capture session
      responses:
        '200': { description: Session, content: { application/json: { schema: { $ref: '#/components/schemas/SessionResponse' } } } }
  /auth/google:
    post:
      summary: Exchange a Google identity token for a Capture session
      responses:
        '200': { description: Session, content: { application/json: { schema: { $ref: '#/components/schemas/SessionResponse' } } } }
  /auth/refresh:
    post:
      summary: Exchange a refresh token for a new token pair
      responses:
        '200': { description: New tokens, content: { application/json: { schema: { $ref: '#/components/schemas/TokenPair' } } } }
  /photographers:
    get:
      summary: Search nearby photographers
      parameters:
        - { name: lat, in: query, required: true, schema: { type: number } }
        - { name: lng, in: query, required: true, schema: { type: number } }
        - { name: radiusKm, in: query, required: false, schema: { type: number, default: 25 } }
        - { name: category, in: query, required: false, schema: { type: string } }
      responses:
        '200':
          description: Photographer cards
          content:
            application/json:
              schema:
                type: object
                properties:
                  photographers:
                    type: array
                    items: { $ref: '#/components/schemas/PhotographerCard' }
  /photographers/{id}:
    get:
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      responses:
        '200':
          description: Photographer detail + services
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PhotographerDetail' }
  /photographers/{id}/availability:
    get:
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: from, in: query, required: false, schema: { type: string, format: date-time } }
        - { name: to,   in: query, required: false, schema: { type: string, format: date-time } }
      responses:
        '200':
          description: Open slots
          content:
            application/json:
              schema:
                type: object
                properties:
                  slots:
                    type: array
                    items: { $ref: '#/components/schemas/Slot' }
  /bookings:
    get:
      summary: Current user's bookings
      responses:
        '200':
          description: Bookings
          content:
            application/json:
              schema:
                type: object
                properties:
                  bookings:
                    type: array
                    items: { $ref: '#/components/schemas/BookingSummary' }
    post:
      summary: Create a booking + Stripe PaymentIntent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [serviceId, slotId]
              properties:
                serviceId: { type: string }
                slotId: { type: string }
                voucherId: { type: string }
                bookingAddress: { type: string }
      responses:
        '201':
          description: Booking created; returns Stripe client secret
          content:
            application/json:
              schema:
                type: object
                properties:
                  bookingId: { type: string }
                  clientSecret: { type: string }
                  totalCents: { type: integer }
  /bookings/{id}/tip:
    post:
      summary: Tip the photographer for a confirmed/completed booking
      description: |
        Creates a Stripe PaymentIntent that routes 100% to the photographer
        (no platform fee). Returns the client secret so iOS can present
        PaymentSheet. Tip is unique per booking.
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amountCents]
              properties:
                amountCents: { type: integer, minimum: 1 }
      responses:
        '201':
          description: Tip created
          content:
            application/json:
              schema:
                type: object
                properties:
                  tipId: { type: string }
                  clientSecret: { type: string }
                  amountCents: { type: integer }
        '200':
          description: Existing pending tip — returns the same client secret so the sheet can resume
        '409':
          description: Booking ineligible (not confirmed, already tipped, etc.)
  /bookings/{id}/tip-suggestions:
    get:
      summary: Canonical tip suggestion amounts for a booking
      parameters: [ { name: id, in: path, required: true, schema: { type: string } } ]
      responses:
        '200':
          description: Suggestions
          content:
            application/json:
              schema:
                type: object
                properties:
                  bookingId: { type: string }
                  subtotalCents: { type: integer }
                  minCents: { type: integer }
                  maxCents: { type: integer }
                  suggestions:
                    type: array
                    items:
                      type: object
                      properties:
                        percent: { type: integer }
                        amountCents: { type: integer }
  /vouchers:
    get:
      summary: Vouchers received by the current user
      responses:
        '200':
          description: Vouchers
          content:
            application/json:
              schema:
                type: object
                properties:
                  vouchers:
                    type: array
                    items: { $ref: '#/components/schemas/Voucher' }
    post:
      summary: Send a voucher to another user
      responses:
        '201': { description: Created }
  /reviews:
    post:
      summary: Customer leaves a 1–5 star review for their booking
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bookingId, rating]
              properties:
                bookingId: { type: string }
                rating: { type: integer, minimum: 1, maximum: 5 }
                body: { type: string, maxLength: 2000 }
      responses:
        '201': { description: Review created }
        '409': { description: Booking already reviewed or not eligible }
  /photographers/{id}/reviews:
    get:
      summary: Recent reviews for a photographer profile
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: limit, in: query, required: false, schema: { type: integer, default: 20 } }
      responses:
        '200':
          description: Reviews
          content:
            application/json:
              schema:
                type: object
                properties:
                  reviews:
                    type: array
                    items: { $ref: '#/components/schemas/Review' }
  /me/photographer/onboarding/start:
    post:
      summary: Start (or resume) Stripe Connect onboarding for the calling user
      responses:
        '200':
          description: Stripe Connect account link
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OnboardingStart' }
  /me/photographer/onboarding/refresh-link:
    post:
      summary: Mint a fresh Stripe Connect account link (used when prior link expired)
      responses:
        '200':
          description: Fresh account link
          content:
            application/json:
              schema:
                type: object
                properties:
                  accountLinkUrl: { type: string }
                  expiresAt: { type: string, format: date-time }
        '409': { description: Onboarding has not been started }
  /me/photographer:
    get:
      summary: The caller's photographer profile + onboarding status
      responses:
        '200':
          description: Photographer self
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PhotographerMe' }
        '404': { description: Caller is not a photographer }
    patch:
      summary: Update profile basics (bio / hourlyRate / homeCity / timezone / etc.)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                bio: { type: string, maxLength: 2000 }
                homeCity: { type: string }
                homeAddress: { type: string }
                heroImageUrl: { type: string, format: uri }
                hourlyRateCents: { type: integer, minimum: 0 }
                timezone: { type: string, description: 'IANA timezone' }
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PhotographerMe' }
  /me/photographer/services:
    post:
      summary: Create a new service offering
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ServiceUpsert' }
      responses:
        '201': { description: Created }
  /me/photographer/services/{id}:
    patch:
      summary: Update one of the caller's services
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ServiceUpsert' }
      responses:
        '200': { description: Updated }
        '404': { description: Not found or not owned by caller }
    delete:
      summary: Soft-delete a service (sets active=false)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Deleted }
        '409': { description: Has upcoming bookings — cannot delete }
  /me/photographer/availability/slots:
    post:
      summary: Bulk-create availability slots
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slots]
              properties:
                slots:
                  type: array
                  minItems: 1
                  maxItems: 50
                  items:
                    type: object
                    required: [startsAt, endsAt]
                    properties:
                      startsAt: { type: string, format: date-time }
                      endsAt: { type: string, format: date-time }
      responses:
        '201': { description: Slots created }
        '409': { description: Slot overlaps existing availability }
  /me/photographer/availability/slots/{id}:
    delete:
      summary: Delete an open slot
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '204': { description: Deleted }
        '409': { description: Slot is held or booked }
  /referrals/me:
    get:
      summary: Caller's referral code, credit balance, and referrals-sent count
      responses:
        '200':
          description: Referral status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReferralStatus' }
  /referrals/claim:
    post:
      summary: Claim a referral code (awards credit to both sides)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string }
      responses:
        '201':
          description: Claim succeeded
          content:
            application/json:
              schema:
                type: object
                properties:
                  creditCents: { type: integer }
                  referrerId: { type: string }
        '400': { description: Unknown code or self-referral }
        '409': { description: User already claimed a referral }
  /messages/{bookingId}:
    get:
      summary: Fetch the full message thread for a booking
      description: |
        Returns the transcript between customer and photographer.
        Side-effect: marks the caller's unread inbound messages as read.
      parameters: [ { name: bookingId, in: path, required: true, schema: { type: string } } ]
      responses:
        '200':
          description: Thread transcript
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MessageThread' }
    post:
      summary: Send a message in a booking thread (lazy-creates the thread)
      parameters: [ { name: bookingId, in: path, required: true, schema: { type: string } } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                body: { type: string, maxLength: 2000 }
                attachmentUrl: { type: string, format: uri }
                attachmentMime: { type: string }
              description: At least one of `body` or `attachmentUrl` is required.
      responses:
        '201':
          description: Message created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        '409':
          description: Thread is locked (booking completed >7 days ago)
  /messages/{bookingId}/share-location:
    post:
      summary: Drop an ephemeral location pin into the thread
      parameters: [ { name: bookingId, in: path, required: true, schema: { type: string } } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lat, lng]
              properties:
                lat: { type: number, minimum: -90, maximum: 90 }
                lng: { type: number, minimum: -180, maximum: 180 }
                durationSeconds:
                  type: integer
                  minimum: 1
                  maximum: 14400
                  default: 1800
                  description: How long the pin stays "live"; capped at 4 hours.
      responses:
        '201':
          description: Pin created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }

components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  schemas:
    Config:
      type: object
      properties:
        stripePublishableKey: { type: string }
        flatCustomerFeeCents: { type: integer }
        commissionRate: { type: number }
    SessionUser:
      type: object
      properties:
        id: { type: string }
        email: { type: string }
        name: { type: string }
        role: { type: string, enum: [customer, photographer, both] }
        avatarUrl: { type: string, nullable: true }
    SessionResponse:
      type: object
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        user: { $ref: '#/components/schemas/SessionUser' }
    TokenPair:
      type: object
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
    PhotographerCard:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        avatarUrl: { type: string, nullable: true }
        heroImageUrl: { type: string, nullable: true }
        homeCity: { type: string }
        bio: { type: string, nullable: true }
        hourlyRateCents: { type: integer }
        avgRating: { type: number }
        ratingCount: { type: integer }
        distanceMeters: { type: number }
    PhotographerDetail:
      allOf:
        - $ref: '#/components/schemas/PhotographerCard'
        - type: object
          properties:
            services:
              type: array
              items: { $ref: '#/components/schemas/Service' }
    Service:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        description: { type: string, nullable: true }
        durationMinutes: { type: integer }
        priceCents: { type: integer }
        category: { type: string }
    Slot:
      type: object
      properties:
        id: { type: string }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
    BookingSummary:
      type: object
      properties:
        id: { type: string }
        status: { type: string }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        totalCents: { type: integer }
        photographer:
          type: object
          properties:
            id: { type: string }
            name: { type: string }
            avatarUrl: { type: string, nullable: true }
            homeCity: { type: string }
        service:
          type: object
          properties:
            title: { type: string }
    Voucher:
      type: object
      properties:
        id: { type: string }
        percentOff: { type: integer }
        category: { type: string }
        expiresAt: { type: string, format: date-time }
        note: { type: string, nullable: true }
        sender:
          type: object
          properties:
            id: { type: string }
            name: { type: string }
            avatarUrl: { type: string, nullable: true }
    Tip:
      type: object
      properties:
        id: { type: string }
        amountCents: { type: integer }
        status: { type: string, enum: [pending_payment, paid, voided] }
        paidAt: { type: string, format: date-time, nullable: true }
    ReferralStatus:
      type: object
      properties:
        code: { type: string }
        creditCents: { type: integer }
        referralsSent: { type: integer }
    Review:
      type: object
      properties:
        id: { type: string }
        rating: { type: integer, minimum: 1, maximum: 5 }
        body: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        serviceTitle: { type: string }
        sessionDate: { type: string, format: date-time }
        customer:
          type: object
          properties:
            name: { type: string }
            avatarUrl: { type: string, nullable: true }
    OnboardingStart:
      type: object
      properties:
        stripeAccountId: { type: string }
        accountLinkUrl: { type: string, format: uri }
        expiresAt: { type: string, format: date-time }
    PhotographerMe:
      type: object
      properties:
        id: { type: string }
        userId: { type: string }
        bio: { type: string, nullable: true }
        homeCity: { type: string }
        homeAddress: { type: string, nullable: true }
        heroImageUrl: { type: string, nullable: true }
        hourlyRateCents: { type: integer }
        timezone: { type: string }
        stripeAccountId: { type: string, nullable: true }
        onboardingStartedAt: { type: string, format: date-time, nullable: true }
        onboardingCompletedAt: { type: string, format: date-time, nullable: true }
        avgRating: { type: number }
        ratingCount: { type: integer }
    ServiceUpsert:
      type: object
      required: [title, durationMinutes, priceCents, category]
      properties:
        title: { type: string }
        description: { type: string }
        durationMinutes: { type: integer, minimum: 5 }
        priceCents: { type: integer, minimum: 0 }
        category:
          type: string
          enum: [portrait, wedding, wedding_video, event, family, headshot, other]
        active: { type: boolean }
    Message:
      type: object
      properties:
        id: { type: string }
        threadId: { type: string }
        senderId: { type: string }
        body: { type: string, nullable: true }
        attachmentUrl: { type: string, nullable: true }
        attachmentMime: { type: string, nullable: true }
        location:
          nullable: true
          type: object
          properties:
            lat: { type: number }
            lng: { type: number }
            expiresAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        readAt: { type: string, format: date-time, nullable: true }
        isMine: { type: boolean }
    MessageThread:
      type: object
      properties:
        bookingId: { type: string }
        threadId: { type: string, nullable: true }
        locked: { type: boolean }
        messages:
          type: array
          items: { $ref: '#/components/schemas/Message' }

security:
  - bearerAuth: []
